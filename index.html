<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bob Ross Canvas Simulation — Blind Comparison</title>
  <style>
    :root {
      --bg-color: #1a1e24;
      --card-bg: #242933;
      --accent: #d8a657;
      --text: #e5e9f0;
      --text-muted: #8892b0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .card h2 {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
    }

    .card p {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-block;
      text-align: center;
      background-color: var(--accent);
      color: #1a1e24;
      font-weight: bold;
      text-decoration: none;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #e5b869;
    }

    .blind-comparison {
      margin-bottom: 2rem;
      text-align: center;
    }

    .blind-comparison p {
      margin-top: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>🎨 Bob Ross Blind Comparison</h1>
    <p>Compare simulations made from the same prompt, with their creators hidden.</p>
  </header>

  <main class="blind-comparison" aria-label="Blind comparison">
    <a href="./viewer.html" class="btn">🎲 Random page</a>
    <p>Compare a randomly selected simulation with its model name hidden.</p>
  </main>

</body>
</html>
