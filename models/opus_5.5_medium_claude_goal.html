<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Little Landscape</title>
<style>
  :root {
    --wall-1: #5b4a3a;
    --wall-2: #382c22;
    --wall-3: #17120e;
    --gold-dark: #6b4c16;
    --gold-mid: #a87d2c;
    --gold-light: #f1d68a;
    --linen: #e7dcc4;
    --brass-ink: #3b2a10;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 8%, rgba(255, 228, 180, .22), transparent 70%),
      radial-gradient(ellipse at 50% 30%, var(--wall-1) 0%, var(--wall-2) 50%, var(--wall-3) 100%);
    color: #f4ead6;
    font-family: Georgia, "Times New Roman", serif;
    overflow-x: hidden;
  }
  /* subtle plaster texture on the wall */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    opacity: .18;
    background-image:
      repeating-linear-gradient(45deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.08) 0 1px, transparent 1px 4px);
  }
  .room {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 16px;
  }
  .wrap {
    width: min(1180px, 100%, calc((100svh - 150px) * 1.42));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .frame {
    position: relative;
    width: 100%;
    padding: clamp(12px, 2.7vw, 34px);
    border-radius: 4px;
    background:
      linear-gradient(135deg, #5d410f 0%, #e7c46b 12%, #8f6820 26%, #f6dd94 42%, #9a7124 58%, #e3bd5e 76%, #6a4b14 100%);
    box-shadow:
      0 40px 70px rgba(0,0,0,.65),
      0 10px 22px rgba(0,0,0,.55),
      inset 0 0 0 1px rgba(255,244,210,.55),
      inset 0 0 0 4px rgba(110,78,20,.65),
      inset 0 0 0 6px rgba(246,221,150,.45),
      inset 0 0 22px 6px rgba(70,45,8,.65);
  }
  /* carved bead running around the frame */
  .frame::before {
    content: "";
    position: absolute;
    inset: clamp(5px, 1vw, 12px);
    border-radius: 2px;
    pointer-events: none;
    background:
      repeating-linear-gradient(90deg, rgba(90,60,10,.55) 0 2px, rgba(255,236,170,.35) 2px 4px, transparent 4px 9px) top / 100% 3px no-repeat,
      repeating-linear-gradient(90deg, rgba(90,60,10,.55) 0 2px, rgba(255,236,170,.35) 2px 4px, transparent 4px 9px) bottom / 100% 3px no-repeat,
      repeating-linear-gradient(0deg, rgba(90,60,10,.55) 0 2px, rgba(255,236,170,.35) 2px 4px, transparent 4px 9px) left / 3px 100% no-repeat,
      repeating-linear-gradient(0deg, rgba(90,60,10,.55) 0 2px, rgba(255,236,170,.35) 2px 4px, transparent 4px 9px) right / 3px 100% no-repeat;
  }
  .corner {
    position: absolute;
    width: clamp(18px, 3.4vw, 42px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #fff3c4 0%, #e8c25e 28%, #9b7122 60%, #5a3f0e 100%);
    box-shadow: 0 2px 5px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,240,190,.35);
    z-index: 2;
  }
  .corner::after {
    content: "";
    position: absolute; inset: 28%;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff6d0, #c99a3c 60%, #6d4f14);
  }
  .tl { top: -6px; left: -6px; } .tr { top: -6px; right: -6px; }
  .bl { bottom: -6px; left: -6px; } .br { bottom: -6px; right: -6px; }
  .liner {
    position: relative;
    padding: clamp(6px, 1.3vw, 16px);
    background:
      repeating-linear-gradient(0deg, rgba(120,100,70,.08) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(120,100,70,.08) 0 1px, transparent 1px 3px),
      var(--linen);
    box-shadow: inset 0 3px 8px rgba(0,0,0,.5), inset 0 0 0 1px rgba(80,60,20,.4);
  }
  .canvas-wrap {
    position: relative;
    box-shadow: 0 0 0 2px #b38b3a, 0 0 0 3px #5a400f, 0 3px 10px rgba(0,0,0,.45);
    background: #ded4bf;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 3 / 2;
  }
  .plaque {
    min-width: min(520px, 92%);
    max-width: 100%;
    padding: 9px 22px 10px;
    border-radius: 3px;
    text-align: center;
    color: var(--brass-ink);
    background: linear-gradient(180deg, #f5dc93 0%, #cfa548 45%, #a77a25 100%);
    box-shadow: 0 6px 14px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,250,220,.7), inset 0 -1px 0 rgba(80,50,10,.6);
  }
  .plaque .title {
    font-size: clamp(11px, 1.35vw, 14px);
    letter-spacing: .22em;
    text-transform: uppercase;
    font-weight: bold;
    text-shadow: 0 1px 0 rgba(255,240,200,.6);
  }
  .plaque .quote {
    margin-top: 3px;
    min-height: 1.4em;
    font-style: italic;
    font-size: clamp(12px, 1.5vw, 16px);
    text-shadow: 0 1px 0 rgba(255,240,200,.5);
    transition: opacity .6s ease;
  }
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    font: inherit;
    font-size: 13px;
    color: #f4e6c6;
    background: rgba(30, 22, 14, .55);
    border: 1px solid rgba(240, 210, 140, .35);
    border-radius: 999px;
    padding: 6px 16px;
    cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  button:hover { background: rgba(60, 44, 24, .75); border-color: rgba(240, 210, 140, .7); }
  button:focus-visible { outline: 2px solid #f1d68a; outline-offset: 2px; }
  button[hidden] { display: none; }
</style>
</head>
<body>
<div class="room">
  <div class="wrap">
    <div class="frame">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div class="liner">
        <div class="canvas-wrap">
          <canvas id="painting" width="1200" height="800" role="img"
            aria-label="An animated landscape painting in a gold frame: a golden-hour sky, snowy mountains, a misty lake, a cabin, a stream and tall evergreens, painted live and then gently moving."></canvas>
        </div>
      </div>
    </div>
    <div class="plaque">
      <div class="title">Golden Hour at Whispering Lake</div>
      <div class="quote" id="quote">Setting up the easel&hellip;</div>
    </div>
    <div class="controls">
      <button id="skip" type="button">Skip to the finished painting</button>
      <button id="replay" type="button" hidden>Paint it again</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ *
 *  Setup
 * ------------------------------------------------------------------ */
const W = 1200, H = 800;
const HZ = 498;                       // lake waterline / horizon
const SUN = { x: 760, y: 300 };

const cv = document.getElementById('painting');
const cssW = cv.getBoundingClientRect().width || 1000;
const S = Math.max(1, Math.min(1.5, Math.round(cssW * (window.devicePixelRatio || 1) / W * 4) / 4));
cv.width = Math.round(W * S);
cv.height = Math.round(H * S);
const ctx = cv.getContext('2d');
ctx.setTransform(S, 0, 0, S, 0, 0);

function mkCanvas(w, h, scale = S) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w * scale));
  c.height = Math.max(1, Math.ceil(h * scale));
  const x = c.getContext('2d');
  x.setTransform(scale, 0, 0, scale, 0, 0);
  return { c, x, w, h };
}

/* ------------------------------------------------------------------ *
 *  Math, randomness, colour
 * ------------------------------------------------------------------ */
function mulberry(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = mulberry(19870611);                 // deterministic: the painting is the same each time
const rnd = (a = 0, b = 1) => a + R() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const mix = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function jit(c, a) {
  const d = rnd(-a, a);
  return [clamp(c[0] + d + rnd(-a, a) * .4, 0, 255), clamp(c[1] + d + rnd(-a, a) * .4, 0, 255), clamp(c[2] + d + rnd(-a, a) * .4, 0, 255)];
}
function grad(stops, t) {
  t = clamp(t, 0, 1);
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const a = stops[i - 1], b = stops[i];
      return mix(a[1], b[1], (t - a[0]) / (b[0] - a[0]));
    }
  }
  return stops[stops.length - 1][1];
}
function noise1(seed) {
  const r = mulberry(seed), v = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) v[i] = r();
  return x => {
    const i = Math.floor(x), f = x - i;
    return lerp(v[i & 1023], v[(i + 1) & 1023], smooth(f));
  };
}
function fbm(n, x, o = 4) {
  let s = 0, a = 1, f = 1, t = 0;
  for (let i = 0; i < o; i++) { s += a * n(x * f); t += a; a *= .5; f *= 2.13; }
  return s / t;
}
// gentle, travelling gusts of wind (roughly -1..1)
function wind(t, x) {
  return Math.sin(t * .55 - x * .003) * .55 + Math.sin(t * 1.27 - x * .0071 + 1.3) * .3 + Math.sin(t * 3.1 + x * .013) * .12;
}

/* Bob Ross's palette, more or less */
const C = {
  white: [248, 245, 236], phthalo: [22, 50, 104], prussian: [18, 34, 62], midnight: [22, 22, 26],
  sienna: [74, 44, 24], vandyke: [46, 32, 22], alizarin: [120, 28, 40], sap: [70, 96, 36],
  cadYellow: [242, 196, 60], ochre: [196, 150, 54], indian: [228, 156, 40], brightRed: [200, 50, 34],
};

/* ------------------------------------------------------------------ *
 *  Brush primitives (used while pre-rendering the painted layers)
 * ------------------------------------------------------------------ */
// A bristle stroke: several thin, slightly curved hairs with colour variation.
function stroke(x, x1, y1, x2, y2, w, col, al = 1, cj = 10, nb) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const n = nb || clamp(Math.round(w / 2.2), 2, 10);
  x.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const o = (n === 1 ? 0 : (i / (n - 1) - .5)) * w + rnd(-.1, .1) * w;
    const s = rnd(0, .12), e = rnd(.85, 1);
    const ax = x1 + dx * s + nx * o, ay = y1 + dy * s + ny * o;
    const bx = x1 + dx * e + nx * o, by = y1 + dy * e + ny * o;
    const b = rnd(-.08, .08) * L;
    x.strokeStyle = rgba(jit(col, cj), al * rnd(.45, 1));
    x.lineWidth = Math.max(.6, w / n * rnd(1.1, 2));
    x.beginPath();
    x.moveTo(ax, ay);
    x.quadraticCurveTo((ax + bx) / 2 + nx * b, (ay + by) / 2 + ny * b, bx, by);
    x.stroke();
  }
}
// A palette-knife pull: a tapered, ragged sliver of paint.
function knife(x, x1, y1, x2, y2, w, col, al) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const n = Math.max(3, L / 5 | 0);
  x.fillStyle = rgba(jit(col, 6), al);
  x.beginPath();
  for (let i = 0; i <= n; i++) {
    const t = i / n, hw = w * .5 * Math.pow(1 - t, .8) * rnd(.75, 1.1);
    x.lineTo(x1 + dx * t + nx * hw, y1 + dy * t + ny * hw);
  }
  for (let i = n; i >= 0; i--) {
    const t = i / n, hw = w * .5 * Math.pow(1 - t, .8) * rnd(.3, .9);
    x.lineTo(x1 + dx * t - nx * hw, y1 + dy * t - ny * hw);
  }
  x.closePath();
  x.fill();
}
// A tap of the brush: a little cluster of short marks (foliage, grass).
function dab(x, cx, cy, r, col, al, n = 4) {
  x.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), l = r * rnd(.4, 1);
    const px = cx + rnd(-r, r) * .6, py = cy + rnd(-r, r) * .6;
    x.strokeStyle = rgba(jit(col, 14), al * rnd(.5, 1));
    x.lineWidth = rnd(.8, 1.8) * Math.max(1, r / 4);
    x.beginPath();
    x.moveTo(px, py);
    x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l * .6);
    x.stroke();
  }
}
function alphaTest(canvas, thr = 40) {
  const cw = canvas.width, ch = canvas.height;
  const d = canvas.getContext('2d').getImageData(0, 0, cw, ch).data;
  return (x, y) => {
    const px = Math.round(x * S), py = Math.round(y * S);
    if (px < 0 || py < 0 || px >= cw || py >= ch) return false;
    return d[(py * cw + px) * 4 + 3] > thr;
  };
}
// Draw a sprite in horizontal slices, each shifted more toward the top: a bend in the wind.
function drawSway(x, spr, cx, by, amt, rev = 1, flex = 1.7) {
  const n = 16, sh = spr.h / n, top = by - spr.h, lim = rev * spr.h;
  const sc = spr.c.height / spr.h;
  for (let i = 0; i < n; i++) {
    const sy = i * sh;
    if (sy >= lim) break;
    const hh = Math.min(sh, lim - sy);
    const f = 1 - (sy + sh / 2) / spr.h;
    const off = amt * Math.pow(f, flex);
    const extra = hh === sh ? .75 : 0;
    x.drawImage(spr.c, 0, sy * sc, spr.c.width, (hh + extra) * sc, cx - spr.ax + off, top + sy, spr.w, hh + extra);
  }
}

/* ------------------------------------------------------------------ *
 *  Scene geometry
 * ------------------------------------------------------------------ */
const nzShore = noise1(77);
function crY(P, x) {
  let i = 0;
  while (i < P.length - 2 && x > P[i + 1][0]) i++;
  const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
  const t = clamp((x - p1[0]) / (p2[0] - p1[0]), 0, 1), t2 = t * t, t3 = t2 * t;
  return .5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);
}
const SHORE = [[-40, 544], [120, 556], [260, 580], [380, 612], [470, 634], [560, 643], [650, 644], [740, 636], [840, 612], [960, 588], [1080, 574], [1240, 566]];
const shoreY = x => crY(SHORE, x) + (nzShore(x * .05) - .5) * 5;

// the stream, meandering from the lake's lip toward the viewer
const nzBankL = noise1(91), nzBankR = noise1(92);
const stS = y => clamp((y - 660) / 140, 0, 1.4);
const stC = y => { const s = stS(y); return 604 + 70 * Math.sin(s * Math.PI * .9) - 190 * s * s; };
const stHW = y => 34 + 190 * Math.pow(Math.max(0, (y - 660) / 140), 1.35);
const stL = y => stC(y) - stHW(y) * (1 + (nzBankL(y * .06) - .5) * .3 * stS(y));
const stR = y => stC(y) + stHW(y) * (1 + (nzBankR(y * .06) - .5) * .3 * stS(y));
const stAt = (y, u) => lerp(stL(y), stR(y), (u + 1) / 2);
const inStream = (x, y) => y >= 640 && x > stL(y) && x < stR(y);

const skyStops = [[0, [34, 58, 110]], [.28, [70, 104, 160]], [.52, [146, 160, 196]], [.7, [222, 194, 186]], [.85, [246, 192, 146]], [1, [250, 220, 172]]];
function skyCol(x, y) {
  const c = grad(skyStops, y / HZ);
  const d = Math.hypot(x - SUN.x, (y - SUN.y) * 1.6);
  return mix(c, [255, 234, 176], Math.exp(-d / 240) * .75);
}

/* ------------------------------------------------------------------ *
 *  Layer registry
 * ------------------------------------------------------------------ */
const LAYERS = [];
const LY = {};
function addLayer(name, stage, draw) {
  const l = { name, stage, draw, cur: null };
  LAYERS.push(l);
  LY[name] = l;
  return l;
}
const fullDraw = canvas => (x) => x.drawImage(canvas, 0, 0, W, H);

/* ------------------------------------------------------------------ *
 *  Builders — each paints one layer stroke by stroke into an offscreen
 *  canvas (or prepares the sprites / particles for a living element)
 * ------------------------------------------------------------------ */
let TEX, BRUSH_STAMP;

function buildTexture() {
  // canvas weave + gentle vignette, blended with 'overlay' each frame
  const tw = Math.ceil(W * S), th = Math.ceil(H * S);
  const c = document.createElement('canvas');
  c.width = tw; c.height = th;
  const x = c.getContext('2d');
  const img = x.createImageData(tw, th), d = img.data;
  const r = mulberry(5);
  for (let py = 0; py < th; py++) {
    const vy = py / th - .5;
    for (let px = 0; px < tw; px++) {
      const vx = px / tw - .5;
      const weave = (Math.sin(px * 1.7 / S) + Math.sin(py * 1.7 / S)) * 5;
      const vig = Math.pow(Math.min(1, (vx * vx * 1.2 + vy * vy * 1.6) * 2.6), 2) * 46;
      const v = 128 + weave + (r() - .5) * 22 - vig;
      const i = (py * tw + px) * 4;
      d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
    }
  }
  x.putImageData(img, 0, 0);
  TEX = c;

  // the reveal stamp: a flat brush footprint with ragged bristle streaks
  const b = document.createElement('canvas');
  b.width = 24; b.height = 96;
  const bx = b.getContext('2d');
  for (let j = 0; j < 96; j++) {
    const e = clamp(Math.min(j, 95 - j) / 16, 0, 1);
    bx.fillStyle = `rgba(0,0,0,${e * rnd(.35, 1)})`;
    bx.fillRect(rnd(0, 5), j, 24 - rnd(0, 10), 1);
  }
  BRUSH_STAMP = b;
}

function buildGesso() {
  addLayer('gesso', 'prep', (x) => {
    x.fillStyle = 'rgb(247,244,237)';
    x.fillRect(0, 0, W, H);
  });
}

function buildSky() {
  const L = mkCanvas(W, H), x = L.x;
  const g = x.createLinearGradient(0, 0, 0, HZ + 40);
  for (const [t, c] of skyStops) g.addColorStop(t, rgba(c));
  x.fillStyle = g;
  x.fillRect(0, 0, W, HZ + 40);
  const rg = x.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, 420);
  rg.addColorStop(0, 'rgba(255,236,180,.85)');
  rg.addColorStop(.4, 'rgba(250,210,160,.35)');
  rg.addColorStop(1, 'rgba(250,200,160,0)');
  x.fillStyle = rg;
  x.fillRect(0, 0, W, HZ + 40);
  // criss-cross X strokes
  for (let y = -10; y < HZ + 40; y += 8) {
    for (let xx = -40; xx < W + 20; xx += rnd(30, 55)) {
      const a = (R() < .5 ? -1 : 1) * rnd(.35, .6), L2 = rnd(60, 120);
      const c = skyCol(xx, y);
      stroke(x, xx, y, xx + Math.cos(a) * L2, y + Math.sin(a) * L2, rnd(22, 36), c, .26, 4);
    }
  }
  // blend it softly, the way a dry brush does
  const B = mkCanvas(W, H);
  B.x.filter = 'blur(3px)';
  B.x.drawImage(L.c, 0, 0, W, H);
  x.globalAlpha = .85;
  x.drawImage(B.c, 0, 0, W, H);
  x.globalAlpha = 1;
  // thin pink and lavender streaks of evening cloud near the horizon
  for (let i = 0; i < 70; i++) {
    const y = rnd(300, 470), xx = rnd(-100, W), len = rnd(120, 360);
    const warm = Math.exp(-Math.abs(xx + len / 2 - SUN.x) / 300);
    const c = mix([196, 160, 190], [252, 196, 160], warm);
    stroke(x, xx, y, xx + len, y + rnd(-3, 3), rnd(2, 6), c, rnd(.15, .35), 8, 3);
  }
  addLayer('sky', 'sky', fullDraw(L.c));
}

function buildSun() {
  const rays = Array.from({ length: 16 }, (_, i) => ({ a: i / 16 * Math.PI * 2 + rnd(-.1, .1), w: rnd(.025, .06), ph: rnd(0, 6) }));
  addLayer('sun', 'sun', (x, t) => {
    const pulse = 1 + Math.sin(t * .6) * .04;
    x.save();
    const g = x.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, 280 * pulse);
    g.addColorStop(0, 'rgba(255,252,232,.95)');
    g.addColorStop(.1, 'rgba(255,240,196,.8)');
    g.addColorStop(.35, 'rgba(255,214,160,.32)');
    g.addColorStop(1, 'rgba(255,200,150,0)');
    x.fillStyle = g;
    x.fillRect(SUN.x - 300, SUN.y - 300, 600, 600);
    // slowly turning shafts of light
    for (const r of rays) {
      const a = r.a + t * .015, al = .045 * (.4 + .6 * Math.sin(t * .5 + r.ph) ** 2);

const clouds = [];
function makeCloud(w, h) {
  const pad = 34, L = mkCanvas(w + pad * 2, h + pad * 2), x = L.x;
  const n = rint(7, 12), puffs = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1), dome = Math.sin(t * Math.PI);
    const r = h * (.2 + .34 * dome) * rnd(.8, 1.15);
    puffs.push({ px: pad + w * (.08 + .84 * t) + rnd(-10, 10), py: pad + h - r * .7 - dome * h * .25 * rnd(.6, 1), r });
  }
  const marks = [];
  for (const p of puffs) {
    for (let k = 0; k < p.r * 2.4; k++) {
      const a = rnd(0, Math.PI * 2), rr = p.r * Math.sqrt(R());
      const cx = p.px + Math.cos(a) * rr, cy = p.py + Math.sin(a) * rr * .85;
      marks.push({ cx, cy, v: clamp((cy - (p.py - p.r)) / (2 * p.r), 0, 1), side: (cx - pad) / w });
    }
  }
  marks.sort((a, b) => b.v - a.v);           // shadowed undersides first, lit tops last
  x.lineCap = 'round';
  for (const m of marks) {
    const lit = mix([255, 248, 236], [255, 224, 182], m.side * .7);
    const col = mix(lit, [150, 140, 176], Math.pow(clamp(m.v * 1.15 - .1, 0, 1), 1.4));
    x.fillStyle = rgba(jit(col, 5), rnd(.12, .28));
    x.beginPath();
    x.ellipse(m.cx, m.cy, rnd(4, 11), rnd(3, 7), rnd(-.4, .4), 0, Math.PI * 2);
    x.fill();
    if (R() < .25) {
      x.strokeStyle = rgba(jit(col, 6), rnd(.15, .3));
      x.lineWidth = rnd(1.5, 3);
      x.beginPath();
      x.arc(m.cx, m.cy, rnd(3, 7), rnd(0, 6), rnd(1, 2.5));
      x.stroke();
    }
  }
  // a flat-ish, dissolving base
  x.globalCompositeOperation = 'destination-out';
  const g = x.createLinearGradient(0, pad + h * .78, 0, pad + h + 10);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.9)');
  x.fillStyle = g;
  x.fillRect(0, pad + h * .78, L.w, L.h);
  x.globalCompositeOperation = 'source-over';
  const B = mkCanvas(L.w, L.h);
  B.x.filter = 'blur(3px)';
  B.x.drawImage(L.c, 0, 0, L.w, L.h);
  B.x.filter = 'none';
  B.x.globalAlpha = .45;
  B.x.drawImage(L.c, 0, 0, L.w, L.h);
  B.test = alphaTest(B.c, 30);
  return B;
}
function buildClouds() {
  const specs = [[120, 80, 330, 110], [520, 52, 260, 84], [880, 110, 380, 120], [330, 205, 200, 64], [1060, 230, 230, 70], [690, 175, 180, 56]];
  for (const [cx, cy, w, h] of specs) {

const cloudTest = (x, y) => clouds.some(c => x > c.x && y > c.y && x < c.x + c.spr.w && y < c.y + c.spr.h && c.spr.test(x - c.x, y - c.y));

function ridgeFn(peaks, nz, amp, jag, base) {
  return x => {
    let m = 1e9;
    for (const p of peaks) {
      const v = p.y + Math.abs(x - p.x) * (x < p.x ? p.l : p.r);
      if (v < m) m = v;
    }
    m += (fbm(nz, x * .011, 4) - .5) * amp + (nz(x * .08 + 40) - .5) * jag;
    return Math.min(m, base + 6);
  };
}
function paintMountain(name, stage, peaks, ridge, base, pal, snowY) {
  const L = mkCanvas(W, H), x = L.x;
  const pts = [];
  let minY = 1e9;
  for (let xx = -12; xx <= W + 12; xx += 3) {
    const y = ridge(xx);
    pts.push([xx, y]);
    if (y < minY) minY = y;
  }
  x.save();
  x.beginPath();
  x.moveTo(-12, base + 4);
  for (const p of pts) x.lineTo(p[0], p[1]);
  x.lineTo(W + 12, base + 4);
  x.closePath();
  const g = x.createLinearGradient(0, minY, 0, base);
  g.addColorStop(0, rgba(pal.dark));
  g.addColorStop(.55, rgba(pal.base));
  g.addColorStop(1, rgba(pal.low));
  x.fillStyle = g;
  x.fill();
  x.clip();
  const lit = y => mix(pal.light, pal.lightLow, clamp((y - snowY) / 90, 0, 1));
  const warm = (c, px) => mix(c, [255, 218, 178], Math.exp(-Math.abs(px - SUN.x) / 260) * .45);
  // body: knife-scraped diagonal texture
  for (let y = minY; y < base; y += 6) {
    for (let xx = -20; xx < W; xx += rnd(25, 45)) {
      if (y < ridge(xx) - 2) continue;
      const c = mix(pal.dark, pal.low, (y - minY) / (base - minY));
      const d = R() < .5 ? -1 : 1;
      stroke(x, xx, y, xx + 18 * d * rnd(.5, 1), y + rnd(16, 30), rnd(4, 8), c, .35, 10, 3);
    }
  }
  // inner ridges: light on the right-hand face, shadow on the left
  for (const p of peaks) {
    const n = rint(3, 6);
    for (let k = 0; k < n; k++) {
      let px = p.x + rnd(-50, 50), py = ridge(px) + rnd(4, 26);
      const dir = R() < .5 ? -1 : 1;
      const len = rnd(50, Math.max(60, (base - py) * .85));
      for (let s = 0; s < len; s += 5) {
        if (R() < .78) knife(x, px + 1, py, px + rnd(8, 30), py + rnd(10, 30), rnd(3, 7), warm(lit(py), px), rnd(.55, .85));
        if (R() < .5) knife(x, px - 1, py, px - rnd(6, 20), py + rnd(8, 24), rnd(3, 6), pal.shadow, .4);
        py += 5;
        px += dir * rnd(0, 6);
      }
    }
  }
  // main ridge highlights
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i];
    const sl = (pts[i + 1][1] - pts[i - 1][1]) / 6;
    const len = rnd(14, 64);
    if (sl > .1 && R() < .85) knife(x, px, py + 1, px + rnd(.1, .5) * len, py + len, rnd(4, 9), warm(lit(py), px), rnd(.6, .9));
    else if (sl < -.1 && R() < .45) knife(x, px, py + 1, px - rnd(.1, .4) * len, py + len * .8, rnd(3, 7), pal.shadow, .35);
  }
  // mist rising at the base
  x.globalCompositeOperation = 'source-atop';
  const mg = x.createLinearGradient(0, base - 140, 0, base);
  mg.addColorStop(0, rgba(pal.mist, 0));
  mg.addColorStop(.7, rgba(pal.mist, .55));
  mg.addColorStop(1, rgba(pal.mist, .92));
  x.fillStyle = mg;
  x.fillRect(0, base - 140, W, 150);
  x.restore();
  addLayer(name, stage, fullDraw(L.c));
  return L;
}

function makeMist(y0, y1, n, col, seed) {

function miniTree(x, cx, by, h, col, lightCol) {
  const top = by - h;
  x.lineCap = 'round';
  x.strokeStyle = rgba(col, .9);
  x.lineWidth = 1;
  x.beginPath(); x.moveTo(cx, top); x.lineTo(cx, by); x.stroke();
  for (let y = top; y < by; y += 1.7) {
    const f = (y - top) / h, hw = h * .22 * f * rnd(.65, 1);
    x.lineWidth = 1.3;
    x.strokeStyle = rgba(jit(col, 8), rnd(.6, 1));
    x.beginPath();
    x.moveTo(cx - hw, y + hw * .35);
    x.lineTo(cx, y);
    x.lineTo(cx + hw, y + hw * .35);
    x.stroke();
    if (lightCol && R() < .3) {
      x.strokeStyle = rgba(jit(lightCol, 10), rnd(.25, .55));
      x.beginPath(); x.moveTo(cx + hw * .2, y + 1); x.lineTo(cx + hw * .9, y + hw * .35 + 1); x.stroke();
    }
  }
}

const glints = [], ripples = [];
let LAKE, REFL;
function buildLake() {
  const L = mkCanvas(W, H), x = L.x;
  const g = x.createLinearGradient(0, HZ, 0, H);
  g.addColorStop(0, rgba(mix(skyCol(600, HZ - 10), [60, 80, 110], .2)));
  g.addColorStop(.4, rgba(mix(skyCol(600, HZ - 140), [40, 60, 96], .4)));

  x.fillStyle = g;
  x.fillRect(0, HZ + 1, W, H - HZ);

    for (let xx = -60; xx < W; xx += rnd(60, 140)) {
      const c = mix(skyCol(xx + 60, my), [40, 62, 98], clamp(.22 + depth * .55, 0, .8));
      stroke(x, xx, y, xx + rnd(80, 200), y + rnd(-1, 1), rnd(4, 7), c, .5, 6, 3);

    stroke(x, xx, HZ + 2, xx + rnd(10, 40), HZ + 2, 1.6, [236, 228, 226], rnd(.3, .7), 4, 1);
  }

  rx.translate(0, 2 * HZ);

  rx.drawImage(NEAR.c, 0, 0, W, H);
  rx.drawImage(TREELINE.c, 0, 0, W, H);
  rx.filter = 'none';
  rx.restore();
  rx.globalCompositeOperation = 'source-atop';
  rx.fillStyle = 'rgba(40,58,92,.28)';
  rx.fillRect(0, HZ, W, H - HZ);
  rx.globalCompositeOperation = 'destination-in';
  const fg = rx.createLinearGradient(0, HZ, 0, H);
  fg.addColorStop(0, 'rgba(0,0,0,.72)');
  fg.addColorStop(.5, 'rgba(0,0,0,.42)');
  fg.addColorStop(1, 'rgba(0,0,0,.2)');
  rx.fillStyle = fg;
  rx.fillRect(0, HZ, W, H - HZ);

    for (let y = HZ + 1; y < 680; y += 3) {

      x.lineWidth = 1.1 + (gl.y - HZ) / 120;

    }

    for (const r of ripples) {

        x.ellipse(r.x, r.y, kk * r.size, kk * r.size * .22, 0, 0, Math.PI * 2);
        x.stroke();
      }
    }
  });
}

}

const smoke = [];
let midEls = [], cabin;
function buildMid() {
  const cab = makeCabin();

  const specs = [
    ['ever', 250, 606, 120], ['ever', 300, 618, 92], ['ever', 345, 630, 70], ['ever', 410, 644, 58],
    ['ever', 845, 632, 82], ['ever', 980, 628, 112], ['ever', 1012, 622, 146], ['ever', 1070, 612, 96],
    ['bush', 870, 640, 64, 34, 'autumn'], ['bush', 390, 656, 54, 26, 'green'], ['bush', 470, 664, 46, 22, 'gold'],
    ['bush', 705, 660, 56, 26, 'autumn'], ['bush', 950, 640, 50, 26, 'gold'], ['tree', 790, 628, 60, 70, 'gold'],
    ['tree', 200, 600, 70, 80, 'autumn'],
  ];
  midEls.push({ spr: cab, x: cabin.x, y: cabin.y, h: cab.h, sway: 0, order: 0 });
  for (const s of specs) {
    let spr;
    if (s[0] === 'ever') spr = makeEvergreen(s[3], PAL.everMid);
    else spr = makeBush(s[3], s[4], PAL[s[5]], s[0] === 'tree');
    midEls.push({ spr, x: s[1], y: s[2], h: spr.h, sway: s[0] === 'ever' ? .012 : .008, autumn: s[5] === 'autumn' || s[5] === 'gold' });
  }
  midEls.forEach((e, i) => e.order = i);
  const drawOrder = midEls.slice().sort((a, b) => a.y - b.y);
  const total = midEls.reduce((s, e) => s + e.h + 40, 0);
  const layer = addLayer('mid', 'mid', (x, t, rev = 1) => {
    // reveal, element by element, top-down
    let acc = 0;
    const reveals = new Array(midEls.length);
    layer.cur = null;
    for (const e of midEls) {
      const span = (e.h + 40) / total;
      const local = clamp((rev - acc) / span, 0, 1);
      reveals[e.order] = local;
      if (local > 0 && local < 1) {
        const f = smooth(local);
        layer.cur = { x: e.x + Math.sin(t * 20) * e.spr.maxHW * f * .7, y: e.y - e.h + 6 + local * (e.h - 8) };
      }
      acc += span;
    }
    for (const e of drawOrder) {
      const r = reveals[e.order];
      if (r <= 0) continue;
      const amt = wind(t, e.x) * e.h * e.sway + Math.sin(t * 2.2 + e.x) * e.h * .003;
      drawSway(x, e.spr, e.x, e.y, e.sway ? amt : 0, r);
      if (e === midEls[0] && r >= 1) {
        // warm firelight in the window
        const fl = .7 + .18 * Math.sin(t * 7.3) * Math.sin(t * 3.1) + .08 * Math.sin(t * 13);
        x.fillStyle = `rgba(255,${180 + fl * 30 | 0},90,${fl})`;
        x.fillRect(e.x - 48 + 65, e.y - 76 + 48, 11, 8);
        x.fillStyle = 'rgba(40,26,18,.9)';
        x.fillRect(e.x - 48 + 70, e.y - 76 + 47, 1.2, 10);
        x.fillRect(e.x - 48 + 64, e.y - 76 + 51.5, 13, 1.2);
        const gl = x.createRadialGradient(e.x + 22, e.y - 24, 0, e.x + 22, e.y - 24, 26);
        gl.addColorStop(0, `rgba(255,190,100,${.18 * fl})`);
        gl.addColorStop(1, 'rgba(255,190,100,0)');
        x.fillStyle = gl;
        x.fillRect(e.x - 10, e.y - 56, 64, 64);
      }
    }
    if (reveals[0] >= 1) {
      for (const p of smoke) {
        const a = .2 * Math.min(1, p.age * 2) * (1 - p.age / p.life);
        if (a <= 0) continue;
        const g = x.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
        g.addColorStop(0, `rgba(214,208,212,${a})`);
        g.addColorStop(1, 'rgba(214,208,212,0)');
        x.fillStyle = g;
        x.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
      }
    }
  });
}

let bigTrees = [];
function buildBigTrees() {
  const specs = [[235, 792, 330], [1060, 806, 400], [150, 816, 500], [1150, 828, 560], [40, 832, 600], [-28, 846, 690], [1236, 846, 660]];

const STAGE_IX = Object.fromEntries(STAGES.map((s, i) => [s.key, i]));
const AFTER_QUOTES = [

function rowStrokes(test, y0, y1, step, w, style) {
  const out = [];
  let dir = 1;
  for (let y = y0; y <= y1; y += step) {
    const iv = [];
    let inside = false, st = 0;
    for (let x = -24; x <= W + 24; x += 6) {
      const v = test(x, y);
      if (v && !inside) { inside = true; st = x; } else if (!v && inside) { inside = false; iv.push([st, x]); }
    }
    if (inside) iv.push([st, W + 24]);
    if (dir < 0) iv.reverse();
    for (const [a, b] of iv) {
      if (b - a < 10) continue;
      const pts = [];
      if (style === 'scrub') {
        let ang = 0;
        for (let xx = dir > 0 ? a : b; dir > 0 ? xx <= b : xx >= a; xx += dir * 3, ang += .55) {
          pts.push([xx + Math.cos(ang) * step * .5, y + Math.sin(ang) * step * .5]);
        }
      } else {
        const amp = style === 'cross' ? step * .9 : style === 'knife' ? step * 1.1 : style === 'dab' ? step * .8 : 1.5;
        const dx = style === 'horiz' ? 40 : style === 'dab' ? 8 : style === 'knife' ? 22 : 34;
        let k = 0;
        for (let xx = dir > 0 ? a : b; dir > 0 ? xx <= b : xx >= a; xx += dir * dx * rnd(.8, 1.2), k++) {
          pts.push([xx, y + (style === 'horiz' ? rnd(-amp, amp) : (k % 2 ? amp : -amp) * rnd(.6, 1))]);
        }
      }
      if (pts.length < 2) pts.push([dir > 0 ? b : a, y]);
      out.push({ pts, w });
    }
    dir = -dir;
  }
  return out;
}
function* walker(strokes) {
  for (const s of strokes) {
    const P = s.pts;
    for (let k = 0; k < P.length - 1; k++) {
      const [x1, y1] = P[k], [x2, y2] = P[k + 1];
      const L = Math.hypot(x2 - x1, y2 - y1) || 1, step = Math.max(2, s.w * .1), a = Math.atan2(y2 - y1, x2 - x1);
      for (let d = 0; d < L; d += step) yield { x: x1 + (x2 - x1) * d / L, y: y1 + (y2 - y1) * d / L, a, w: s.w, len: step };
    }
  }
}
function pathLength(strokes) {
  let n = 0;
  for (const it of walker(strokes)) n += it.len;
  return n;
}
function buildStageStrokes(fgInfo) {
  const sky = (x, y) => y < HZ + 30;
  const S_ = {
    prep: () => rowStrokes(() => true, 30, H - 20, 64, 110, 'horiz'),
    sky: () => rowStrokes(sky, 18, HZ + 20, 34, 64, 'cross'),
    sun: () => {
      const pts = [];
      for (let a = 0; a < Math.PI * 7; a += .12) {
        const r = 6 + a * 13;
        pts.push([SUN.x + Math.cos(a) * r, SUN.y + Math.sin(a) * r * .8]);
      }
      return [{ pts, w: 46 }];
    },
    clouds: () => rowStrokes(cloudTest, 30, 300, 16, 34, 'scrub'),
    far: () => rowStrokes(alphaTest(FAR.c), 130, 490, 20, 40, 'knife'),
    mist: () => rowStrokes((x, y) => y > 395 && y < 500, 405, 495, 28, 60, 'horiz'),
    near: () => rowStrokes(alphaTest(NEAR.c), 290, 505, 20, 38, 'knife'),
    treeline: () => rowStrokes(alphaTest(TREELINE.c), 436, 504, 12, 26, 'dab'),
    lake: () => rowStrokes((x, y) => y > HZ && y < shoreY(x) + 6, HZ + 8, 650, 22, 40, 'horiz'),
    land: () => rowStrokes(alphaTest(LAND.c), 548, 800, 24, 46, 'cross'),
    stream: () => rowStrokes((x, y) => inStream(x, y) || (y < 664 && x > 556 && x < 652 && y > 636), 642, 800, 18, 34, 'horiz'),
    fg: () => rowStrokes((x, y) => fgInfo.onBank(x, y) || fgInfo.onBank(x, y + 30), 660, 800, 22, 46, 'cross'),

const MASK = mkCanvas(W, H), TMP = mkCanvas(W, H);

}
function startStage(i) {

function advancePainting(dt) {
  const st = STAGES[cur];
  stT += dt;
  const p = stT / st.dur;
  if (st.mode === 'mask') {
    const target = Math.min(1, p / .88) * st.total;
    let last = null;
    const m = MASK.x;
    while (walked < target) {
      const n = walk.next();
      if (n.done) { walked = st.total; break; }
      const it = n.value;
      walked += it.len;
      m.save();
      m.translate(it.x, it.y);
      m.rotate(it.a);
      m.globalAlpha = .85;
      m.drawImage(BRUSH_STAMP, -it.w * .18, -it.w / 2, it.w * .36, it.w);
      m.restore();
      last = it;

    if (last) { cursor.tx = last.x; cursor.ty = last.y; }
    if (p > .88) {
      m.fillStyle = 'rgba(0,0,0,.12)';
      m.fillRect(0, 0, W, H);

function updateLife(dt) {
  for (const c of clouds) {
    c.x += c.v * dt;
    if (c.x > W + 40) c.x = -c.spr.w - 60;
  }
  eagle.a += dt * .11;
  // smoke from the chimney
  smokeTimer -= dt;
  if (smokeTimer <= 0) {
    smokeTimer = .22;
    smoke.push({ x: cabin.x - 48 + 74 + Math.random() * 2, y: cabin.y - 76 + 6, r: 3, age: 0, life: 6 + Math.random() * 2 });
  }
  for (const p of smoke) {
    p.age += dt;
    p.y -= (9 + p.age * 1.5) * dt;
    p.x += (5 + wind(T, p.x) * 7 + p.age * 1.4) * dt;
    p.r += 3.2 * dt;
  }
  while (smoke.length && smoke[0].age > smoke[0].life) smoke.shift();

  rippleTimer -= dt;

  if (cur < STAGE_IX.life) return;

  for (const b of birds) {
    b.x += b.vx * dt;
    b.ph += b.fr * dt * (Math.sin(T * .45 + b.glide) > .45 ? .1 : 1);
  }
  for (let i = birds.length - 1; i >= 0; i--) if (birds[i].x < -200 || birds[i].x > W + 200) birds.splice(i, 1);
  // leaves letting go of the autumn bushes

    const e = src[Math.random() * src.length | 0];
    leaves.push({
      x: e.x + (Math.random() - .5) * e.spr.w * .6, y: e.y - e.spr.h * (.4 + Math.random() * .4),
      vx: 0, vy: 0, rot: Math.random() * 6, vr: (Math.random() - .5) * 4, flip: Math.random() * 6,
      size: 2 + Math.random() * 2.2 * (e.y > 690 ? 1.4 : .8), age: 0, life: 6 + Math.random() * 6,
      col: ['#e0952e', '#c9572a', '#f0c050', '#a8401e', '#d8a040'][Math.random() * 5 | 0],
    });
  }
  for (const l of leaves) {
    l.age += dt;
    l.vx = lerp(l.vx, 14 + wind(T, l.x) * 26, dt * 1.5);
    l.vy = 12 + Math.sin(l.age * 2.2 + l.rot) * 9;
    l.x += l.vx * dt;
    l.y += l.vy * dt;
    l.rot += l.vr * dt;

    x.beginPath();
    if (fan) { x.moveTo(-5, -44); x.lineTo(5, -44); x.lineTo(3.5, -180); x.lineTo(-3.5, -180); }
    else { x.moveTo(-13, -46); x.lineTo(13, -46); x.lineTo(6, -82); x.lineTo(5, -190); x.lineTo(-5, -190); x.lineTo(-6, -82); }
    x.closePath(); x.fill();
  }
  x.restore();
}

function render() {
  const x = ctx;
  x.globalCompositeOperation = 'source-over';
  x.globalAlpha = 1;
  x.fillStyle = 'rgb(224,214,194)';
  x.fillRect(0, 0, W, H);
  if (ready) {
    for (const l of LAYERS) {
      const si = STAGE_IX[l.stage];
      if (si < cur) { l.draw(x, T, 1); continue; }
      if (si > cur) continue;
      const st = STAGES[si], p = clamp(stT / st.dur, 0, 1);
      if (st.mode === 'mask') {
        TMP.x.clearRect(0, 0, W, H);
        l.draw(TMP.x, T, 1);
        TMP.x.globalCompositeOperation = 'destination-in';
        TMP.x.drawImage(MASK.c, 0, 0, W, H);
        TMP.x.globalCompositeOperation = 'source-over';
        x.drawImage(TMP.c, 0, 0, W, H);
      } else if (st.mode === 'seq') {
        l.draw(x, T, Math.min(1, p / .94));
      } else {
        x.globalAlpha = smooth(p);
        l.draw(x, T, 1);
        x.globalAlpha = 1;
      }
    }
  }
  if (TEX) {
    x.globalCompositeOperation = 'overlay';
    x.globalAlpha = .5;
    x.drawImage(TEX, 0, 0, W, H);
    x.globalCompositeOperation = 'source-over';
    x.globalAlpha = 1;
  }
  if (painting && cursor.on && STAGES[cur] && STAGES[cur].tool) {
    drawTool(x, cursor.x, cursor.y, STAGES[cur].tool, STAGES[cur].paint, T);
  }
}

function step(dt) {
  T += dt;
  if (ready) {
    if (painting) advancePainting(dt);
    updateLife(dt);
  }
  const k = Math.min(1, dt * 22);
  cursor.x += (cursor.tx - cursor.x) * k;
  cursor.y += (cursor.ty - cursor.y) * k;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  step(dt);
  render();
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------ *
 *  Build everything, a little at a time so the page stays responsive
 * ------------------------------------------------------------------ */
async function build() {
  const tick = () => new Promise(r => setTimeout(r, 0));
  let fgInfo;
  const steps = [
    buildTexture, buildGesso, buildSky, buildSun, buildClouds, buildMountains, buildMists, buildTreeline,
    buildLake, buildLand, buildMid, buildStream, () => { fgInfo = buildForeground(); }, buildBigTrees, buildLife,
    () => buildStageStrokes(fgInfo),
  ];
  // keep z-order independent of build order
  const Z = ['gesso', 'sky', 'sun', 'clouds', 'farMtn', 'mist1', 'nearMtn', 'mist2', 'treeline', 'lake', 'land', 'mid', 'stream', 'fgBank', 'bigTrees', 'fgFront', 'life'];
  for (const s of steps) { s(); await tick(); }
  LAYERS.sort((a, b) => Z.indexOf(a.name) - Z.indexOf(b.name));
  ready = true;
  // ?at=SECONDS fast-forwards (handy for previews); ?done jumps to the finished painting
  const params = new URLSearchParams(location.search);
  begin();
  if (params.has('done')) { spawnFlock(); finish(); }
  const at = parseFloat(params.get('at'));
  if (at > 0) for (let t = 0; t < at; t += 1 / 30) step(1 / 30);
  last = performance.now();
}
requestAnimationFrame(frame);
build();
})();
</script>
</body>
