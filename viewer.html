<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blind Simulation Comparison</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #1a1e24;
      color: #e5e9f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
    }
    a { color: #e5e9f0; }
    button {
      border: 0;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      background: #d8a657;
      color: #1a1e24;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #e5b869; }
    button:disabled { opacity: 0.6; cursor: default; }
    #status, #metadata { margin: 0; color: #b5becb; }
    iframe { flex: 1; width: 100%; min-height: 0; border: 0; background: white; }
    iframe[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <a href="./index.html">← Blind comparison</a>
    <button id="random" type="button" disabled>🎲 Random page</button>
    <a href="./gallery.html" title="See all simulations side by side">🖼 Compare all</a>
    <button id="reveal" type="button" disabled>Reveal model</button>
    <p id="identity" role="status" hidden></p>
    <p id="status" role="status">Loading simulations…</p>
    <p id="metadata" aria-live="polite"></p>
  </header>
  <iframe id="simulation" title="Anonymous simulation" sandbox="allow-scripts" hidden></iframe>
  <noscript>Enable JavaScript to select a random simulation.</noscript>
  <script>
    const button = document.getElementById('random');
    const status = document.getElementById('status');
    const frame = document.getElementById('simulation');
    const metadata = document.getElementById('metadata');
    const reveal = document.getElementById('reveal');
    const identity = document.getElementById('identity');
    let pages = [];
    let current = null;
    let selection = 0;

    function showPage(page) {
      current = page.id;
      selection++;
      identity.hidden = true;
      identity.textContent = '';
      reveal.disabled = false;
      reveal.textContent = 'Reveal model';
      history.replaceState(null, '', `#${page.id}`);
      frame.hidden = false;
      frame.src = `./anonymous/${page.id}.html`;
      const size = page.bytes < 1024
        ? `${page.bytes.toLocaleString()} bytes`
        : `${(page.bytes / 1024).toFixed(1)} KiB (${page.bytes.toLocaleString()} bytes)`;
      metadata.textContent = `HTML · ${size} · ${page.lines.toLocaleString()} lines`;
      status.textContent = pages.length === 1
        ? 'Model hidden · Only one simulation available'
        : 'Model hidden · Choose another page to compare';
    }

    function randomPage() {
      const choices = pages.filter(page => page.id !== current);
      if (!choices.length) {
        showPage(pages[0]);
        return;
      }
      // Rejection sampling avoids bias when mapping random integers to pages.
      const limit = Math.floor(0x100000000 / choices.length) * choices.length;
      const value = new Uint32Array(1);
      do { crypto.getRandomValues(value); } while (value[0] >= limit);
      showPage(choices[value[0] % choices.length]);
    }

    button.addEventListener('click', randomPage);

    reveal.addEventListener('click', async () => {
      const requestedSelection = selection;
      reveal.disabled = true;
      reveal.textContent = 'Revealing…';
      try {
        const response = await fetch(`./identities/${current}.json`, { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not load identity');
        const result = await response.json();
        if (!result || typeof result.model !== 'string' || !result.model.trim()) {
          throw new Error('Invalid identity');
        }
        if (selection !== requestedSelection) return;
        identity.textContent = `Created by: ${result.model}`;
        identity.hidden = false;
        reveal.textContent = 'Model revealed';
        status.textContent = 'Choose another page to start a new blind comparison';
      } catch (error) {
        if (selection !== requestedSelection) return;
        identity.textContent = 'Could not reveal the model. Please try again.';
        identity.hidden = false;
        reveal.disabled = false;
        reveal.textContent = 'Reveal model';
      }
    });

    async function start() {
      try {
        const response = await fetch('./pages.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not load simulations');
        const manifest = await response.json();
        if (!Array.isArray(manifest) || !manifest.every(page =>
          page && typeof page.id === 'string' && /^[a-f0-9]{32}$/.test(page.id) &&
          Number.isSafeInteger(page.bytes) && page.bytes >= 0 &&
          Number.isSafeInteger(page.lines) && page.lines >= 0)) {
          throw new Error('Invalid simulation list');
        }
        pages = [...new Map(manifest.map(page => [page.id, page])).values()];
        if (!pages.length) {
          status.textContent = 'No simulations available yet.';
          return;
        }
        const requested = location.hash.slice(1);
        const selected = pages.find(page => page.id === requested);
        if (selected) showPage(selected);
        else randomPage();
        button.disabled = false;
      } catch (error) {
        status.textContent = 'Could not load simulations. Please reload the page.';
      }
    }

    start();
  </script>
</body>
</html>
