<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Simulations — Side by Side</title>
  <style>
    :root {
      --bg-color: #1a1e24;
      --card-bg: #242933;
      --accent: #d8a657;
      --text: #e5e9f0;
      --text-muted: #8892b0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    header h1 { font-size: 1.25rem; color: var(--accent); }
    a { color: var(--text); }
    button {
      border: 0;
      border-radius: 6px;
      padding: 0.5rem 0.9rem;
      background: var(--accent);
      color: #1a1e24;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #e5b869; }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { color: var(--text-muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      padding: 1.5rem;
    }
    .cell {
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      overflow: hidden;
    }
    .cell figcaption {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      padding: 0.6rem 0.9rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .cell .name { font-weight: bold; }
    .cell .meta { color: var(--text-muted); font-size: 0.8rem; white-space: nowrap; }
    .cell iframe {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      border: 0;
      background: #101015;
    }
  </style>
</head>
<body>
  <header>
    <a href="./index.html" aria-label="Back to homepage">←</a>
    <h1>All simulations, side by side</h1>
    <button id="replay" type="button" disabled>↻ Replay all</button>
    <button id="reveal" type="button" disabled>Reveal models</button>
    <p id="status" role="status">Loading simulations…</p>
  </header>
  <noscript>Enable JavaScript to load the gallery.</noscript>
  <main id="gallery" class="grid" aria-label="All simulations"></main>
  <script>
    const grid = document.getElementById('gallery');
    const status = document.getElementById('status');
    const replay = document.getElementById('replay');
    const reveal = document.getElementById('reveal');
    let pages = [];

    const labelFor = (index) =>
      String.fromCharCode(65 + (index % 26)) + (index >= 26 ? Math.floor(index / 26) : '');

    const metaFor = (page) => {
      const size = page.bytes < 1024
        ? `${page.bytes.toLocaleString()} bytes`
        : `${(page.bytes / 1024).toFixed(1)} KiB`;
      return `${size} · ${page.lines.toLocaleString()} lines`;
    };

    function render() {
      grid.textContent = '';
      pages.forEach((page, index) => {
        const figure = document.createElement('figure');
        figure.className = 'cell';

        const caption = document.createElement('figcaption');
        const name = document.createElement('span');
        name.className = 'name';
        name.dataset.pageId = page.id;
        name.textContent = `Simulation ${labelFor(index)}`;
        const meta = document.createElement('span');
        meta.className = 'meta';
        meta.textContent = metaFor(page);
        caption.append(name, meta);

        const frame = document.createElement('iframe');
        frame.title = `Simulation ${labelFor(index)}`;
        frame.setAttribute('sandbox', 'allow-scripts');
        frame.src = `./anonymous/${page.id}.html`;
        figure.append(caption, frame);
        grid.append(figure);
      });
      replay.disabled = false;
      reveal.disabled = false;
      reveal.textContent = 'Reveal models';
      status.textContent = `Showing ${pages.length} of ${pages.length} simulations, models hidden`;
    }

    replay.addEventListener('click', () => {
      grid.querySelectorAll('iframe').forEach(frame => { frame.src = frame.src; });
      grid.querySelectorAll('.name').forEach(name => {
        name.textContent = `Simulation ${labelFor(pages.findIndex(page => page.id === name.dataset.pageId))}`;
      });
      reveal.textContent = 'Reveal models';
      status.textContent = 'Replaying all simulations, models hidden';
    });

    reveal.addEventListener('click', async () => {
      reveal.disabled = true;
      reveal.textContent = 'Revealing…';
      const results = await Promise.all(pages.map(async (page) => {
        try {
          const response = await fetch(`./identities/${page.id}.json`, { cache: 'no-store' });
          if (!response.ok) throw new Error('Could not load identity');
          const result = await response.json();
          return { id: page.id, label: result && typeof result.model === 'string' && result.model.trim() ? result.model : null };
        } catch {
          return { id: page.id, label: null };
        }
      }));
      let revealed = 0;
      grid.querySelectorAll('.name').forEach(name => {
        const match = results.find(result => result.id === name.dataset.pageId);
        if (match && match.label) {
          name.textContent = match.label;
          revealed++;
        }
      });
      status.textContent = revealed === pages.length
        ? 'All models revealed'
        : 'Could not reveal some models';
      reveal.textContent = 'Models revealed';
      reveal.disabled = false;
    });

    async function start() {
      try {
        const response = await fetch('./pages.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not load simulations');
        const manifest = await response.json();
        if (!Array.isArray(manifest) || !manifest.every(page =>
          page && typeof page.id === 'string' && /^[a-f0-9]{32}$/.test(page.id) &&
          Number.isSafeInteger(page.bytes) && page.bytes >= 0 &&
          Number.isSafeInteger(page.lines) && page.lines >= 0)) {
          throw new Error('Invalid simulation list');
        }
        pages = [...new Map(manifest.map(page => [page.id, page])).values()];
        if (!pages.length) {
          status.textContent = 'No simulations available yet.';
          return;
        }
        render();
      } catch {
        status.textContent = 'Could not load simulations. Please reload the page.';
      }
    }

    start();
  </script>
</body>
</html>
